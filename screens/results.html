<!-- RESULT SOLO -->
<section id="screen-result" hidden
  class="relative mx-auto flex min-h-0 w-full max-w-md flex-1 flex-col items-center justify-center gap-5 overflow-y-auto px-4 py-4 text-center sm:max-w-xl sm:py-6 md:max-w-2xl">
  
  <span class="rotate-2 rounded-full border-2 border-[#12100E] bg-[#F5A623] px-4 py-1 text-xs font-black uppercase tracking-widest text-[#12100E] shadow-[0_3px_0_#12100E]">
    Your Score
  </span>

  <div class="space-y-1">
    <p id="result-score" class="text-6xl font-black tabular-nums text-[#FFF7EB] sm:text-7xl md:text-8xl"></p>
    <p id="result-detail" class="inline-block rounded-full border-2 border-[#12100E] bg-[#161D27] px-5 py-2 text-base font-black text-[#29B6F6] shadow-[0_3px_0_#12100E] sm:text-lg"></p>
  </div>

  <p class="max-w-[34ch] text-xs font-bold text-slate-400 sm:text-sm">
    Your brain cells put up a brave fight before completely fizzling out into ashes.
  </p>

  <div class="flex w-full flex-col gap-3 pt-2">
    <button id="btn-again" type="button"
      class="w-full rounded-2xl border-4 border-[#12100E] bg-[#FF5A1F] px-6 py-4 text-xl font-black text-[#12100E] shadow-[0_6px_0_#12100E] transition hover:brightness-110 active:translate-y-1 active:shadow-[0_1px_0_#12100E] sm:text-2xl">
      🔄 Play Again
    </button>
    <button id="btn-home" type="button"
      class="w-full rounded-2xl border-2 border-[#12100E] bg-[#161D27] px-6 py-3.5 text-base font-black text-[#FFF7EB] transition hover:bg-[#0D1117] active:scale-98">
      ← Home
    </button>
  </div>
</section>

<!-- RESULT MULTIPLAYER -->
<section id="screen-result-1v1" hidden
  class="relative mx-auto flex min-h-0 w-full max-w-md flex-1 flex-col items-center justify-center gap-5 overflow-y-auto px-1 py-4 text-center sm:max-w-xl sm:py-6 md:max-w-2xl lg:max-w-6xl">
  
  <p id="winner-label" class="rise-in stagger-1 text-4xl font-black text-[#FFF7EB] sm:text-5xl md:text-6xl"></p>

  <p id="botfrag" hidden class="max-w-[88ch] text-xl font-black leading-snug text-[#D72638] sm:text-2xl"></p>

  <div class="bezel rise-in stagger-2 w-full">
  <div class="halftone w-full space-y-3 rounded-3xl border-4 border-[#12100E] bg-[#161D27] p-5 shadow-[0_8px_0_#12100E] sm:p-6">
    <p class="border-b-2 border-[#12100E] pb-2 text-xs font-black uppercase tracking-wider text-[#F5A623]">
      🏆 Leaderboard
    </p>
    <ol id="r1-standings" class="w-full space-y-2 text-left lg:grid lg:grid-cols-2 lg:gap-3 lg:space-y-0"></ol>
    <p id="r1-note" class="pt-2 text-xs font-bold text-slate-400"></p>
  </div>
  </div>

  <button id="btn-1v1-rematch" type="button"
    class="rise-in stagger-3 w-full rounded-2xl border-4 border-[#12100E] bg-[#FF5A1F] px-6 py-4 text-xl font-black text-[#12100E] shadow-[0_6px_0_#12100E] transition hover:brightness-110 active:translate-y-1 active:shadow-[0_1px_0_#12100E] sm:text-2xl lg:mx-auto lg:max-w-xl">
    🔄 Rematch
  </button>
  <button id="btn-1v1-home" type="button"
    class="rise-in stagger-3 w-full rounded-2xl border-4 border-[#12100E] bg-[#29B6F6] px-6 py-4 text-xl font-black text-[#12100E] shadow-[0_6px_0_#12100E] transition hover:brightness-110 active:translate-y-1 active:shadow-[0_1px_0_#12100E] sm:text-2xl lg:mx-auto lg:max-w-xl">
    ← Home
  </button>
</section>

<!-- FULLSCREEN COUNTDOWN OVERLAY -->
<div id="overlay-countdown" hidden class="fixed inset-0 z-50 flex flex-col items-center justify-center bg-[#0D1117]/95 backdrop-blur-md">
  <p class="text-sm font-black uppercase tracking-[0.3em] text-[#FF5A1F] animate-pulse text-center">Get Ready!</p>
  <p id="countdown-num" class="text-[9rem] font-black tabular-nums text-[#FFF7EB] drop-shadow-[0_8px_0_#12100E] sm:text-[11rem]">
    3
  </p>
</div>

<!-- FULLSCREEN DISCONNECT OVERLAY -->
<div id="overlay-disconnect" hidden class="fixed inset-0 z-50 flex flex-col items-center justify-center gap-4 bg-[#0D1117]/95 p-6 text-center backdrop-blur-md">
  <span class="rounded-full border-2 border-[#12100E] bg-[#D72638] px-4 py-1 text-xs font-black uppercase tracking-widest text-[#FFF7EB] shadow-[0_3px_0_#12100E]">
    Connection Lost
  </span>
  <p class="text-2xl font-black text-[#FFF7EB] sm:text-3xl">The host disconnected</p>
  <p id="disconnect-count" class="text-7xl font-black tabular-nums text-[#FF5A1F] drop-shadow-[0_5px_0_#12100E] sm:text-8xl">
    10
  </p>
  <p class="max-w-xs text-xs font-bold text-slate-400 sm:text-sm">
    Going back to the home screen…
  </p>
  <button id="btn-dc-home" type="button"
    class="mt-2 rounded-2xl border-2 border-[#12100E] bg-[#161D27] px-6 py-3 font-black text-[#FFF7EB] shadow-[0_3px_0_#12100E] transition hover:bg-[#0D1117]">
    Back to Home
  </button>
</div>
