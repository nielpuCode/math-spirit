<!-- HOME -->
<section id="screen-home" class="flex min-h-0 flex-1 flex-col justify-center gap-5 overflow-y-auto py-4">
  <header class="shrink-0 text-center">
    <p class="text-xs font-bold uppercase tracking-[0.25em] text-sky-400/90">2-digit math</p>
    <h1 class="mt-3 text-5xl font-extrabold tracking-tight text-transparent bg-clip-text bg-gradient-to-b from-white via-slate-100 to-slate-400 sm:text-6xl">
      Math Sprint
    </h1>
    <p class="mt-3 text-slate-400">Big numbers. Fast taps. Tricky answers.</p>
  </header>

  <div class="shrink-0 rounded-3xl border border-slate-800/90 bg-slate-900/70 p-5 shadow-2xl shadow-sky-950/50 backdrop-blur space-y-5">
    <div>
      <label for="q-count" class="mb-2 block text-xs font-bold uppercase tracking-wider text-slate-400">Questions</label>
      <input id="q-count" type="number" min="1" max="500" value="20"
        class="w-full rounded-2xl border border-slate-700/80 bg-slate-950/90 px-4 py-3 text-2xl font-extrabold tabular-nums text-sky-100 outline-none transition focus:border-sky-400 focus:ring-2 focus:ring-sky-500/30" />
    </div>
    <label class="flex cursor-pointer items-center gap-3 rounded-2xl border border-slate-700/80 bg-slate-950/90 px-4 py-3 transition hover:border-slate-600">
      <input id="q-infinite" type="checkbox" class="h-5 w-5 rounded accent-sky-400" />
      <span class="text-lg font-bold text-slate-200">Infinite mode</span>
    </label>
    <p class="text-sm leading-relaxed text-slate-500">Finite runs show final score. Infinite shows live score until you stop.</p>
  </div>

  <button id="btn-play" type="button"
    class="w-full shrink-0 rounded-2xl bg-gradient-to-b from-sky-400 to-sky-600 px-6 py-5 text-2xl font-extrabold text-slate-950 shadow-lg shadow-sky-500/40 transition hover:brightness-110 active:scale-[0.98] active:brightness-95">
    Play
  </button>

  <button id="btn-multi" type="button"
    class="w-full shrink-0 rounded-2xl border border-indigo-400/40 bg-indigo-500/10 px-6 py-4 text-xl font-extrabold text-indigo-200 transition hover:bg-indigo-500/20 active:scale-[0.98]">
    Play 1v1
  </button>
  <p class="shrink-0 text-center text-xs text-slate-500">Same questions · cyan vs amber · no login</p>
</section>
