<!-- HOME -->
<section id="screen-home" class="relative mx-auto flex min-h-0 w-full max-w-md flex-1 flex-col justify-center gap-4 overflow-y-auto p-0 sm:max-w-xl sm:gap-6 md:max-w-2xl lg:max-w-3xl">
  
  <!-- Header / Mascot / Troll Hook -->
  <header class="shrink-0 text-center">
    <div class="relative mx-auto inline-block">
      <img src="/logo.png" alt="TickTickMath mascot"
        class="mx-auto h-24 w-24 rounded-xl border-4 border-[#12100E] bg-[#161D27] p-1 transition-transform duration-200 hover:rotate-3 sm:h-28 sm:w-28" />
      <span class="absolute -right-3 -top-2 rotate-12 rounded-full border-2 border-[#12100E] bg-[#FF5A1F] px-2.5 py-0.5 text-[10px] font-black uppercase tracking-wider text-[#FFF7EB] shadow-[0_3px_0_#12100E]">
        BOOM!
      </span>
    </div>

    <p class="mt-3 text-xs font-black uppercase tracking-[0.28em] text-[#F5A623] sm:text-sm">
      Single-Braincell Speed Math
    </p>

    <h1 class="mt-1 text-5xl font-black tracking-tight text-[#FFF7EB] sm:text-6xl md:text-7xl">
      TickTick<span class="text-[#FF5A1F]">Math</span>
    </h1>

    <p class="mx-auto mt-2 max-w-[40ch] text-xs font-bold leading-relaxed text-[#F6E6C9]/80 sm:text-sm md:text-base">
      Test if your elementary school diploma was an actual lie.
    </p>
  </header>

  <!-- Options Card (Parchment Ink Slab) -->
  <div class="shrink-0 rounded-3xl border-4 border-[#12100E] bg-[#161D27] p-4 shadow-[0_8px_0_#12100E] sm:p-6 md:p-7">
    <div class="space-y-4 sm:space-y-5">
      <div>
        <div class="mb-2 flex items-center justify-between">
          <label for="q-count" class="text-xs font-black uppercase tracking-wider text-[#F5A623] sm:text-sm">
            Question Dose
          </label>
          <span class="text-[11px] font-bold text-slate-400">Max 500 if you hate yourself</span>
        </div>
        <input id="q-count" type="number" min="1" max="500" value="10"
          class="w-full rounded-2xl border-2 border-[#12100E] bg-[#0D1117] px-4 py-3 text-2xl font-black tabular-nums text-[#FFF7EB] outline-none transition focus:border-[#F5A623] focus:ring-2 focus:ring-[#F5A623]/30 sm:py-3.5 sm:text-3xl" />
      </div>

      <label class="flex cursor-pointer select-none items-center justify-between gap-3 rounded-2xl border-2 border-[#12100E] bg-[#0D1117] px-4 py-3 transition hover:border-slate-600 sm:py-3.5">
        <div class="flex items-center gap-3">
          <input id="q-infinite" type="checkbox"
            class="h-6 w-6 rounded-lg border-2 border-[#12100E] accent-[#FF5A1F] transition cursor-pointer" />
          <span class="text-base font-black text-[#FFF7EB] sm:text-lg">Infinite Brainrot Run</span>
        </div>
        <span class="rounded-full bg-[#FF5A1F]/20 px-2.5 py-0.5 text-[10px] font-black uppercase text-[#FF5A1F] ring-1 ring-[#FF5A1F]/40">
          No Mercy
        </span>
      </label>

      <p class="text-xs leading-relaxed text-slate-400 sm:text-sm">
        Fixed rounds give you a report card. Infinite mode just keeps going until you give up.
      </p>
    </div>
  </div>

  <!-- Primary Action Stack -->
  <div class="flex shrink-0 flex-col gap-3">
    <button id="btn-play" type="button"
      class="w-full rounded-2xl border-4 border-[#12100E] bg-[#FF5A1F] px-6 py-4 text-xl font-black text-[#12100E] shadow-[0_6px_0_#12100E] transition hover:brightness-110 active:translate-y-1 active:shadow-[0_2px_0_#12100E] sm:py-5 sm:text-2xl">
      DETONATE SOLO 🧨
    </button>

    <button id="btn-multi" type="button"
      class="w-full rounded-2xl border-4 border-[#12100E] bg-[#29B6F6] px-4 py-3.5 text-lg font-black text-[#12100E] shadow-[0_6px_0_#12100E] transition hover:brightness-110 active:translate-y-1 active:shadow-[0_2px_0_#12100E] sm:py-4 sm:text-xl">
      DRAG YOUR FRIENDS TO HELL 💀
    </button>
  </div>

  <p class="shrink-0 text-center text-xs font-bold text-slate-500">
    Up to 8 players. Same questions. Zero sign up.
  </p>
</section>
